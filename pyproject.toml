[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "progv-trace-demo"
version = "0.1.0"
description = "Minimal offline demo of ProgV-Trace (not the paper's experiment code)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yifan Xiao" }]
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["progv"]

[tool.setuptools.package-data]
progv = ["data/cases/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
